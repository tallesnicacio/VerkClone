<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#128C7E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#25D366;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect width="128" height="128" rx="24" fill="url(#grad1)"/>

  <!-- Icon: Users/CRM symbol -->
  <g transform="translate(32, 32)" fill="white" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- First person -->
    <circle cx="20" cy="18" r="10"/>
    <path d="M 4 54 Q 4 42 20 42 Q 36 42 36 54"/>

    <!-- Second person -->
    <circle cx="44" cy="18" r="10"/>
    <path d="M 28 54 Q 28 42 44 42 Q 60 42 60 54"/>
  </g>

  <!-- Small WhatsApp chat bubble indicator -->
  <g transform="translate(84, 84)">
    <circle cx="12" cy="12" r="18" fill="#25D366"/>
    <path d="M 6 12 L 10 16 L 18 8" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
